language = "typescript"
# A project naming no `files` of its own scans what its plugins declare, so this
# is the first run for anyone `habit-hooks init` set up. An installed dependency
# is never the project's source — at the top level or vendored beside a package
# in a monorepo — and reaching into it buries the project's own findings under
# tens of thousands from other people's packages.
files = ["**/*.ts", "**/*.tsx", "!**/node_modules/**"]
# Programs, not data: each helper keeps a judgement a static recipe cannot
# eslint retries the project's own config before the shipped one (the
# eslint retries the project's own config before the shipped one, knip merges a production pass gated on config markers into the
# default one, comment is a bespoke ts-morph analyzer. `argv` as an inline
# entry rather than a `command` string because a shell recipe cannot run where
# there is no POSIX shell, which is every native Windows machine.
sensors = [
  # The helper spawns eslint itself, so this argv is the helper's own.
  # `${args}` — the project's `[sensors.eslint] args` — comes first and the
  # scoped files last, with `--` between them: eslint options and file paths
  # are both bare words, so without a separator the helper could not tell an
  # option's value from a path (`--config configs/eslint.mjs` ends in an
  # extension it lints).
  { name = "eslint", tool = "node", args = ["${dir}/sensors/eslint.cjs", "${args}", "--", "${files}"] },
  # The helper spawns knip itself, so `${args}` — the project's own
  # `[sensors.knip] args` — arrives as the helper's argv and is forwarded from
  # there. A `--config` among them is the project naming its config, and the
  # helper treats it as one: ours is not named alongside it, and the production
  # gate reads the markers of the config the args chose.
  { name = "knip", tool = "node", args = ["${dir}/sensors/knip.cjs", "${args}"] },
  { name = "comment", tool = "node", args = ["${dir}/sensors/comment.cjs", "${files}"] },
]
transformers = []

# node comes first because everything under it needs it: every one of these
# sensors is a node script, `npm install` is itself node, and a `node-module`
# detector cannot be looked for without it. habit-sensors only puts the project's
# node_modules/.bin on PATH, so node itself is the system's.
#
# eslint, knip and ts-morph are all `node-module`, not `command`: none of the
# three is ever spawned by name. eslint and knip run through
# `sensors/project_tool.cjs`, which finds the package under the project's own
# node_modules and runs its bin script with `process.execPath` — a `command`
# detector asks the system PATH, which a global install satisfies and the run
# can no longer reach. ts-morph is read as a library rather than
# spawned at all, so being on PATH never said anything about it either.
detectors = [
  { name = "node", kind = "command", install = "brew install node" },
  { name = "eslint", kind = "node-module", install = "npm install --save-dev eslint" },
  { name = "knip", kind = "node-module", install = "npm install --save-dev knip" },
  { name = "ts-morph", kind = "node-module", install = "npm install --save-dev ts-morph" },
]
