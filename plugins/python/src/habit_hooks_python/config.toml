# Python plugin defaults.
language = "python"
# A project naming no `files` of its own scans what its plugins declare, so this
# is the first run for anyone `habit-hooks init` set up. An installed package is
# never the project's source; `site-packages` is where one lands whatever the
# environment is called, so it answers for a `venv/` as well as a `.venv/`.
files = ["**/*.py", "!**/site-packages/**", "!**/.venv/**", "!**/venv/**"]
sensors = [
  # ruff inline: the same invocation the old helper made — the pinned
  # `--select` is this plugin's own vocabulary (a project-config policy is the
  # framework's to own, #171), and exit 1 is ruff saying "violations found",
  # both trustworthy. The mapping lives in ruff.jq: a code it has no smell for
  # passes through under its own name, where `uncoached` catches it.
  { tool = "ruff", args = ["check", "--output-format=json", "--select=C901,PLR0913,PLR0915,F841,F401,BLE001", "${files}"], transform = "ruff.jq", success_exit_codes = [0, 1] },
  # deptry is a shipped program, for one reason: a project declaring no
  # dependencies at all is a clean run (#88) — deptry answers that case by
  # exiting 1 and writing no report, which the inline form can only read as a
  # failed run. That judgement stays in the program until the framework owns
  # the policy (issue #171) — the same stopgap jscpd's sensor keeps.
  "deptry",
]
transformers = []

detectors = [
  { name = "ruff", kind = "command", install = "pip install ruff" },
  { name = "deptry", kind = "command", install = "pip install deptry" },
]
