# Deprecated alias of `snooze`: what this transformer was the opt-in for — an
# exemption that lapses when the file changes — is now what snoozing is, so both
# names run the same command. The name is still accepted so an existing config
# keeps resolving; a new project names `snooze`.
#
# `${python} -m`, not the bare console script, for the same reason as snooze.toml:
# the bin directory is not always on PATH.
argv = ["${python}", "-m", "habit_hooks.snooze"]
