# Dogfooding config: habit-hooks runs against its own repo. Consumer repos
# commit this same file, so ours is checked in too.

plugins = ["python", "generic"]

# Allowlist: a plugin not named here is never scanned. The python plugin's own
# subtree stays unnamed because it ships its own ruff.toml, which ruff's upward discovery would read
# instead of this repo's pyproject.
files = [
  "src/**/*.py",
  "tests/**/*.py",
  "conftest.py",
  "plugins/generic/src/**/*.py",
  "plugins/generic/tests/**/*.py",
  "plugins/java/src/**/*.py",
  "plugins/java/tests/**/*.py",
  "plugins/php/src/**/*.py",
  "plugins/php/tests/**/*.py",
  "plugins/ruby/src/**/*.py",
  "plugins/ruby/tests/**/*.py",
  "plugins/typescript/src/**/*.py",
  "plugins/typescript/tests/**/*.py",
]
